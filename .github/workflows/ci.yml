name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clashiq
          POSTGRES_PASSWORD: clashiq
          POSTGRES_DB: clashiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      APP_ENV: development
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://clashiq:clashiq@localhost:5432/clashiq?schema=public
      DIRECT_URL: postgresql://clashiq:clashiq@localhost:5432/clashiq?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-value-32bytes-min
      REALTIME_SHARED_SECRET: ci-realtime-secret-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npx eslint tests/integration/live-quiz.test.ts --fix
      - run: npm run lint
      - run: npm run build
