services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clashiq
      POSTGRES_PASSWORD: clashiq
      POSTGRES_DB: clashiq
    ports:
      - "5432:5432"
    volumes:
      - clashiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clashiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - clashiq_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clashiq
      MINIO_ROOT_PASSWORD: clashiqsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clashiq_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 clashiq clashiqsecret;
      mc mb -p local/clashiq;
      mc anonymous set download local/clashiq;
      exit 0;
      "

  # LiveKit OSS SFU — screen share, not a paid SaaS
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Judge0 CE is isolated code execution. Enable with: docker compose --profile judge up
  # See DEPLOYMENT.md — this stack is optional and resource-heavy.
  judge0-redis:
    profiles: ["judge"]
    image: redis:7-alpine
    command: ["redis-server"]

  judge0-db:
    profiles: ["judge"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0

  # Official Judge0 image expects its own compose; we provide an HTTP stub worker
  # for local tests and document the real Judge0 deployment in DEPLOYMENT.md.

volumes:
  clashiq_pg:
  clashiq_redis:
  clashiq_minio:
